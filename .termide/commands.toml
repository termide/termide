[build-release]
command = "cargo build --release"
name = "Build release"
mode = "report"
key = "Ctrl+Alt+B"

# Terminal-Bench runs (tools/bench/README.md). A job runs detached from
# termide; these start, follow and stop it.
[bench-start]
command = "{ [ \"$TERMIDE_PARAM_BUILD\" != true ] || tools/bench/build.sh; } && AGENT={agent} MODEL={model} CONCURRENT={concurrent} tools/bench/start.sh {job} {set} $TERMIDE_PARAM_ARGS"
name = "Start a job"
group = "Benchmark"
mode = "report"
cwd = "project"

[[bench-start.params]]
name = "job"
label = "Job name"

[[bench-start.params]]
name = "set"
label = "Task set"
type = "select"
options = ["sub18", "debug8", "all"]

[[bench-start.params]]
name = "agent"
label = "Harness"
type = "select"
options = ["termide", "opencode", "qwen-coder", "claude-code", "termide-claude-code"]

[[bench-start.params]]
name = "model"
label = "Model (claude-code, termide-claude-code: claude-sonnet-5-5)"
default = "Qwen3.8-Flash-Next-oQ4e-mtp"

[[bench-start.params]]
name = "concurrent"
label = "Trials at once (1 for any comparison)"
default = "1"

[[bench-start.params]]
name = "build"
label = "Rebuild termide first"
type = "bool"
default = false

[[bench-start.params]]
name = "args"
label = "Harbor args (other harnesses: --agent-setup-timeout-multiplier 4)"

[bench-watch]
command = "tools/bench/status.sh --watch"
name = "Status"
group = "Benchmark"
mode = "terminal"
cwd = "project"

[bench-stop]
command = "tools/bench/stop.sh {job}"
name = "Stop a job"
group = "Benchmark"
mode = "report"
cwd = "project"

[[bench-stop.params]]
name = "job"
label = "Job name (empty: every running one)"

[bench-resume]
command = "tools/bench/resume.sh {job}"
name = "Resume a job"
group = "Benchmark"
mode = "report"
cwd = "project"

[[bench-resume.params]]
name = "job"
label = "Job name"
