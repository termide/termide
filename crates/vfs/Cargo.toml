[package]
name = "termide-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Virtual File System abstraction for termide with network filesystem support"

[dependencies]
thiserror = "2.0"
url.workspace = true
percent-encoding = "2"
log = "0.4"

# SFTP support — pure-Rust russh stack (no OpenSSL/libssh2 needed).
russh = "0.63"
russh-sftp = "2.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "time", "net", "fs"] }

# FTP support — rustls TLS provider (pure-Rust, enables musl-static builds).
# `rustls-ring` keeps the TLS stack pure Rust (ring, not aws-lc-rs) so
# musl-static builds need no cmake/C toolchain.
suppaftp = { version = "10.0.2", features = ["rustls-ring"] }
webpki-roots = "1"

# SMB support (optional, may require system libraries)
pavao = { version = "0.2", optional = true }

# Archive support — pure-Rust decoders only (no C zstd/xz/bzip2), so
# musl-static builds keep needing no C toolchain. zip's deflate goes
# through flate2's default miniz_oxide backend.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "aes-crypto"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
flate2 = { version = "1", optional = true }
bzip2 = { version = "0.6", optional = true }
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz", "optimization", "encoder"], optional = true }
ruzstd = { version = "0.9", optional = true }

# For temp file management
tempfile.workspace = true

# For directory cache
dirs.workspace = true

[features]
default = ["sftp", "ftp", "archive"]
sftp = []
ftp = []
smb = ["pavao"]
nfs = []
archive = ["dep:zip", "dep:tar", "dep:flate2", "dep:bzip2", "dep:lzma-rust2", "dep:ruzstd"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
# Encoders to build test archives.
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz", "encoder"] }
bzip2 = "0.6"

