[package]
name = "termide-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Virtual File System abstraction for termide with network filesystem support"
publish = false

[dependencies]
thiserror.workspace = true
url.workspace = true
percent-encoding.workspace = true
log.workspace = true

# SFTP support — pure-Rust russh stack (no OpenSSL/libssh2 needed). Its
# crypto on ring, as the TLS below, rather than the default aws-lc-rs, a C
# library built with cmake: one crypto backend in the binary, and no cmake.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.2"
# Hashed known_hosts names (`|1|salt|hash`); the versions russh already uses.
hmac = "0.13"
sha1 = "0.11"
# Salt for hashed known_hosts names; the version russh already uses.
getrandom.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "io-util", "macros", "time", "net", "fs"] }

# FTP support — rustls TLS provider (pure-Rust, enables musl-static builds).
# `rustls-ring` keeps the TLS stack pure Rust (ring, not aws-lc-rs) so
# musl-static builds need no cmake/C toolchain.
suppaftp = { version = "10.0.2", features = ["rustls-ring"] }
webpki-roots.workspace = true

# SMB2/3 — pure Rust on tokio, crypto from RustCrypto: no libsmbclient
# (GPL, not linkable statically) and no C toolchain.
smb2 = { version = "0.43", default-features = false, features = ["tokio"], optional = true }

# NFSv3 — pure Rust on tokio; its `nfs3_types` come re-exported.
nfs3_client = { version = "0.9", features = ["tokio"], optional = true }

# Archive support — pure-Rust decoders only (no C zstd/xz/bzip2), so
# musl-static builds keep needing no C toolchain. zip's deflate goes
# through flate2's default miniz_oxide backend.
zip = { workspace = true, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "aes-crypto"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
flate2 = { version = "1", optional = true }
bzip2 = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, features = ["std", "xz", "optimization", "encoder"], optional = true }
ruzstd = { version = "0.9", optional = true }

# For temp file management
tempfile.workspace = true

# For directory cache
dirs.workspace = true

[features]
default = ["sftp", "ftp", "smb", "nfs", "archive"]
sftp = []
ftp = []
smb = ["dep:smb2"]
nfs = ["dep:nfs3_client"]
archive = ["dep:zip", "dep:tar", "dep:flate2", "dep:bzip2", "dep:lzma-rust2", "dep:ruzstd"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
# Encoders to build test archives.
lzma-rust2 = { workspace = true, features = ["std", "xz", "encoder"] }
bzip2.workspace = true
# An in-memory NFSv3 server to test the NFS provider against.
nfs3_server = { version = "0.11", features = ["memfs"] }

