[package]
name = "termide-panel-outline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
tree-sitter.workspace = true
streaming-iterator = "0.1"
regex.workspace = true
log.workspace = true

# Grammar parsers
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-java.workspace = true
tree-sitter-kotlin-ng.workspace = true
tree-sitter-ruby.workspace = true
# Must match termide-highlight's tree-sitter-php: two versions in one binary
# collide the `tree_sitter_php` C symbol and break PHP highlighting.
tree-sitter-php.workspace = true
# Must match termide-highlight's tree-sitter-lua, for the same symbol collision.
tree-sitter-lua.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-md.workspace = true

termide-clipboard = { path = "../clipboard" }
termide-config = { path = "../config" }
termide-core = { path = "../core" }
termide-highlight = { path = "../highlight" }
termide-i18n = { path = "../i18n" }
termide-theme = { path = "../theme" }
termide-ui = { path = "../ui" }
