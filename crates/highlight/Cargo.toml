[package]
name = "termide-highlight"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Syntax highlighting for termide using tree-sitter"
publish = false

[dependencies]
ratatui.workspace = true
log.workspace = true
ropey.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true

# Grammar parsers (statically linked)
# Programming languages
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-java.workspace = true
# Kotlin grammar (ABI-14 compatible; ships no bundled highlights query, so the
# highlighter hand-writes one — see KOTLIN_HIGHLIGHTS).
tree-sitter-kotlin-ng.workspace = true
tree-sitter-ruby.workspace = true
# Grammar ABI must fall within the workspace tree-sitter's supported range
# (13-15 for 0.27); an out-of-range grammar builds fine but fails to load at
# runtime, which silently disables its highlighting.
tree-sitter-php.workspace = true
tree-sitter-haskell = "0.24"
tree-sitter-nix = "0.3"
tree-sitter-lua.workspace = true

# Web technologies
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.23"

# Configuration formats
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash.workspace = true
tree-sitter-md.workspace = true
