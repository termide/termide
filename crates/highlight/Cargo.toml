[package]
name = "termide-highlight"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Syntax highlighting for termide using tree-sitter"

[dependencies]
ratatui.workspace = true
anyhow.workspace = true
log.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true

# Grammar parsers (statically linked)
# Programming languages
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
# Kotlin grammar (ABI-14 compatible; ships no bundled highlights query, so the
# highlighter hand-writes one — see KOTLIN_HIGHLIGHTS).
tree-sitter-kotlin-ng = "1.1"
tree-sitter-ruby = "0.23"
# Pinned to 0.23: 0.24 ships grammars built with tree-sitter ABI 15, which the
# workspace's tree-sitter 0.24 (max ABI 14) rejects, silently disabling PHP.
tree-sitter-php = "0.23"
tree-sitter-haskell = "0.23"
tree-sitter-nix = "0.3"

# Web technologies
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.23"

# Configuration formats
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-md = "0.3"
