[package]
name = "termide-panel-terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
dunce.workspace = true
log.workspace = true
portable-pty.workspace = true
ratatui.workspace = true
regex.workspace = true
unicode-width.workspace = true
vte.workspace = true

# Workspace crates
termide-config = { path = "../config" }
termide-core = { path = "../core" }
termide-i18n = { path = "../i18n" }
termide-modal = { path = "../modal" }
termide-theme = { path = "../theme" }
termide-ui = { path = "../ui" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
