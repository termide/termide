[package]
name = "termide-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared HTTP client setup for termide: TLS trusting the bundled and the system roots"
publish = false

[dependencies]
log.workspace = true
ureq.workspace = true
# The same rustls ureq 2 links, with the ring provider it uses, so the
# config handed to `AgentBuilder::tls_config` is its type.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots.workspace = true
