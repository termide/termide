[package]
name = "termide-secrets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Master-password encrypted credential vault for termide"

[dependencies]
thiserror = "2.0"
serde.workspace = true
toml.workspace = true
base64.workspace = true
url.workspace = true
percent-encoding = "2"
dirs.workspace = true
# Pure-Rust crypto, the same RustCrypto/dalek generation russh already pulls
# in, so the lock file gains no second copy of any primitive.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
