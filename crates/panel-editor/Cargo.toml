[package]
name = "termide-panel-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Text editor panel for termide"
publish = false

[dependencies]
# External
anyhow.workspace = true
crossterm.workspace = true
log.workspace = true
lsp-types.workspace = true
ratatui.workspace = true
regex.workspace = true
ropey.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
dirs.workspace = true

# Workspace crates
termide-buffer = { path = "../buffer" }
termide-vfs = { path = "../vfs" }
termide-clipboard = { path = "../clipboard" }
termide-config = { path = "../config" }
termide-core = { path = "../core" }
termide-debug = { path = "../debug" }
termide-git = { path = "../git" }
termide-highlight = { path = "../highlight" }
termide-i18n = { path = "../i18n" }
termide-keyboard = { path = "../keyboard" }
termide-lsp = { path = "../lsp" }
termide-modal = { path = "../modal" }
# Hover popups render their Markdown with the shared renderer
termide-panel-markdown = { path = "../panel-markdown" }
termide-project = { path = "../project" }
termide-state = { path = "../state" }
termide-system-monitor = { path = "../system-monitor" }
termide-theme = { path = "../theme" }
termide-ui = { path = "../ui" }

# Diagram generation
termide-panel-outline = { path = "../panel-outline" }
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-kotlin-ng.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-ruby.workspace = true
# Must match termide-highlight's tree-sitter-php: two versions in one binary
# collide the `tree_sitter_php` C symbol and break PHP highlighting.
tree-sitter-php.workspace = true

[dev-dependencies]
tempfile.workspace = true
