# Linux links with what the toolchain picks: rust-lld on x86_64 (rustc's
# default since 1.90), the system's cc and ld elsewhere. GNU ld was forced
# here until 2026-11 without a recorded reason; it links the binary in about
# 6.4 s where lld takes 1.0 and mold 0.55 (arm64 Linux), and the tree-sitter
# grammars link and pass their tests with all three. A faster linker of your
# own goes in ~/.cargo/config.toml (doc/en/developer-guide.md, Platform notes).

# The C code of the grammars is built without strict aliasing. The `array.h`
# that grammars generated before tree-sitter 0.26.4 vendor grows an array
# through an `(Array *)` cast and then reads `contents` through the scanner's
# own type (tree-sitter/tree-sitter#4960); optimised with strict aliasing, GCC
# keeps the pointer from before the realloc and writes into freed memory. The
# Haskell scanner did (tree-sitter-haskell#144; glibc aborted
# `cargo test --release -p termide-highlight` on Linux), and the bash, html,
# python, ruby and yaml scanners use the same macros. A CFLAGS set in the
# environment replaces this one: add -fno-strict-aliasing to it (the AUR
# PKGBUILD does).
[env]
CFLAGS = "-fno-strict-aliasing"

# macOS targets
[target.x86_64-apple-darwin]
linker = "cc"

[target.aarch64-apple-darwin]
linker = "cc"

# Windows target (for cross-compilation if needed)
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
