# Linux links with what the toolchain picks: rust-lld on x86_64 (rustc's
# default since 1.90), the system's cc and ld elsewhere. GNU ld was forced
# here until 2026-11 without a recorded reason; it links the binary in about
# 6.4 s where lld takes 1.0 and mold 0.55 (arm64 Linux), and the tree-sitter
# grammars link and pass their tests with all three. A faster linker of your
# own goes in ~/.cargo/config.toml (doc/en/developer-guide.md, Platform notes).

# The C code of the grammars is built without strict aliasing. The Haskell
# grammar's scanner (tree-sitter-haskell 0.23 and 0.24) grows its lookahead
# buffer through tree-sitter's `Array` macros while declaring the buffer as a
# struct of its own; optimised with strict aliasing, GCC keeps the pointer from
# before the realloc and writes into freed memory, which glibc aborts on
# (`cargo test --release -p termide-highlight` on Linux). A CFLAGS set in the
# environment replaces this one: add -fno-strict-aliasing to it (the AUR
# PKGBUILD does).
[env]
CFLAGS = "-fno-strict-aliasing"

# macOS targets
[target.x86_64-apple-darwin]
linker = "cc"

[target.aarch64-apple-darwin]
linker = "cc"

# Windows target (for cross-compilation if needed)
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
