# termide configuration of every scenario unless it names its own with
# `config FILE`. `{mock_llm_port}` is replaced by the port the mock model of
# a `mock-llm` scenario listens on. Keep it close to the defaults: scenarios
# check what users get.
[general]
language = "en"
icon_mode = "unicode"
# The status bar's resource figures change on their own; keep them still.
resource_monitor_interval = 60000

[editor]
show_blame = false

[ai]
connection = "local"

[ai.connections.local]
provider = "openai_compatible"
base_url = "http://127.0.0.1:{mock_llm_port}/v1"
model = "qwen3-coder-30b-a3b"

[ai.permissions]
mode = "configured"

[ai.permissions.edit]
"inventory/**" = "allow"

# The agent scenario answers a permission card on the test run.
[ai.permissions.shell]
"python3 *" = "ask"
