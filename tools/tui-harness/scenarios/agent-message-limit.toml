# The configuration of agent-message-limit: the shared config.toml with
# agents allowed a single message to one another without the user, so the
# second background hand-over meets the limit. `{mock_llm_port}` is the port
# of the scenario's mock model.
[general]
language = "en"
icon_mode = "unicode"
# The status bar's resource figures change on their own; keep them still.
resource_monitor_interval = 60000

[editor]
show_blame = false

[ai]
connection = "local"
max_agent_messages = 1

[ai.connections.local]
provider = "openai_compatible"
base_url = "http://127.0.0.1:{mock_llm_port}/v1"
model = "qwen3-coder-30b-a3b"

[ai.permissions]
mode = "configured"

[ai.permissions.edit]
"inventory/**" = "allow"

[ai.permissions.shell]
"python3 *" = "ask"
