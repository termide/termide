name: CI

# PR-facing checks. Runs the same fmt / clippy / test / supply-chain
# gates that release.yml uses for tagged builds, but on every pull
# request and every push to main — so reviewers see a green check
# (or a failing log) before merging instead of finding out at
# release time.
#
# The gates run on Linux and macOS, the two platforms with day-to-day
# developers. Cross-platform *binary* builds (Windows, musl, aarch64
# cross) stay in release.yml; they only matter at release time and would
# burn minutes here on every iteration.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal token scope: PR checks only read the repository, no write
# is needed (release.yml is what writes tags / artifacts). Pinning
# this at the workflow level keeps CodeQL's
# `actions/missing-workflow-permissions` rule happy and shrinks the
# blast radius if a compromised step tries to escalate.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cancel an older run of the same workflow when a new commit lands
# on the same PR — keeps the queue from piling up during rapid
# iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms on a PR rather than hiding the second
      # failure behind the first.
      fail-fast: false
      matrix:
        # Linux and macOS take genuinely different code paths — process
        # and mount-table introspection, clipboard, keyboard enhancement
        # flags — and release.yml only builds macOS at tag time, which is
        # far too late to learn a PR broke it. Windows stays release-only:
        # it has no daily developer on it.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to the same version release.yml uses; drift here
        # would let a PR pass and the release-on-tag job fail.
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        # Formatting is platform-independent; checking it twice only
        # doubles the ways a run can go red for the same reason.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      # No separate `cargo check`: clippy runs the full compiler checks
      # itself, as the pre-commit hook relies on.
      - name: Run clippy (strict mode)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # nextest, like the pre-commit hook: one process per test binary in
        # parallel, and a non-zero exit on a test that fails to even start.
        # The `ci` profile (.config/nextest.toml) retries a failure once and
        # reports a test that then passes as flaky.
        run: cargo nextest run --workspace --profile ci

      - name: Grammar tests with the C code optimised as released
        # The debug build compiles the grammars' C at -O0, which hid a heap
        # write after realloc in the Haskell scanner that only strict
        # aliasing at -O2 and up turns on (see .cargo/config.toml). glibc
        # aborts on it, so Linux is where it shows.
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p termide-highlight

  unused-deps:
    name: Manifest hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # An unused dependency declaration produces no warning from cargo, so
      # nothing but a dedicated check keeps them from piling back up.
      - name: cargo machete
        run: cargo machete

      # The install instructions, the flake and the AUR packages repeat the
      # version; a copy left behind by a bump fails here, not at release.
      - name: Release version in every copy
        run: tools/release/version.sh --check

      # doc/ru follows doc/en heading for heading; doc/zh only warns.
      - name: Translated docs keep the English structure
        run: tools/docs/headings.sh

  deny:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check
