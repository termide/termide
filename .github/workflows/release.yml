name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quality checks before building
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag that is not the version Cargo.toml and its copies carry would
      # publish files named for one version holding another.
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tools/release/version.sh --check
          CARGO_VERSION=$(awk '/^\[workspace\.package\]/{s=1; next} /^\[/{s=0} s && /^version = "/{gsub(/version = "|"/, ""); print; exit}' Cargo.toml)
          if [ "$CARGO_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the version ${CARGO_VERSION} in Cargo.toml"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      # fmt, clippy and the tests over the whole workspace, on Linux only;
      # ci.yml runs the full set (machete, nextest, docs, macOS) on every
      # push. clippy covers `cargo check`.
      - name: Run clippy (strict mode)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Install cargo-deny
        # Rust-cache lets us skip rebuilding cargo-deny on every run;
        # `--locked` keeps the version reproducible.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply-chain audit (cargo-deny)
        run: cargo deny check

  # Cross-platform builds
  build:
    name: Build ${{ matrix.target }}
    needs: quality-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (also works in WSL)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04  # Use older Ubuntu for glibc compatibility
            archive: tar.gz
          # Linux x86_64 (musl, fully static — runs on Alpine and any
          # other distro without a glibc dependency)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            musl: true
          # Linux aarch64 (ARM servers, Raspberry Pi)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04  # Use older Ubuntu for glibc compatibility
            archive: tar.gz
            cross: true
          # Linux aarch64 (musl, fully static — runs under Termux on Android,
          # Alpine on ARM, and any glibc-free ARM64 system). Built via `cross`
          # so the musl toolchain + tree-sitter C deps link cleanly.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            use_cross: true
          # macOS x86_64 (Intel Macs)
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows x86_64 (native)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools (Linux musl)
        if: matrix.musl
        # The musl C library + gcc wrapper. Rust's musl target links
        # statically by default, so no `target-feature=+crt-static`
        # flag is needed here; just the C toolchain to wrap any C deps.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        # `cross` builds inside a target-matched container that ships the musl
        # cross toolchain, so the Rust code and the tree-sitter C deps link
        # against the same musl without hand-wiring a sysroot.
        run: cargo install cross --locked

      - name: Build
        # VFS uses rustls / russh — fully pure-Rust, no native OpenSSL —
        # so no extra features are required for static builds.
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/termide package/
          cp README.md LICENSE package/
          cp -r completions package/
          cd package
          tar czvf ../termide-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
          cd ..

      - name: Upload unsigned exe (Windows)
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          # Not named termide-*: the release takes only those.
          name: unsigned-exe
          path: target/${{ matrix.target }}/release/termide.exe

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "target/${{ matrix.target }}/release/termide.exe" package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "termide-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($f in (Get-ChildItem "termide-${{ github.ref_name }}-${{ matrix.target }}.*" -Exclude *.sha256)) {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline "$f.sha256"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-${{ matrix.target }}
          path: termide-${{ github.ref_name }}-${{ matrix.target }}.*

  # Build Debian packages
  build-deb:
    name: Build .deb packages
    needs: quality-checks
    runs-on: ubuntu-22.04  # Use older Ubuntu for glibc compatibility with Debian 12
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build and package
        run: cargo deb --target ${{ matrix.target }}

      - name: Checksum
        working-directory: target/${{ matrix.target }}/debian
        run: for f in *.deb; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb*

  # Build RPM packages
  build-rpm:
    name: Build .rpm packages
    needs: quality-checks
    runs-on: ubuntu-22.04  # Use older Ubuntu for glibc compatibility
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate RPM
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Checksum
        working-directory: target/${{ matrix.target }}/generate-rpm
        run: for f in *.rpm; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-rpm-${{ matrix.target }}
          path: target/${{ matrix.target }}/generate-rpm/*.rpm*

  # Sign the Windows binary via SignPath (free OSS code signing).
  # Skipped when the secrets are not configured: releases keep working before
  # the SignPath application is approved.
  sign-windows:
    name: Sign Windows binary
    needs: build
    runs-on: ubuntu-latest
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    permissions:
      actions: read
      contents: read
    steps:
      # First: checkout empties a workspace that is not a repository yet,
      # which would take the files below with it.
      - name: Checkout for packaging files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Download unsigned exe
        uses: actions/download-artifact@v4
        with:
          name: unsigned-exe
          path: unsigned

      - name: Upload for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input
          path: unsigned/termide.exe

      - name: Submit signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          wait-for-completion-timeout-in-seconds: 1200

      # The signed exe with the files the unsigned zip has beside it.
      - name: Build signed release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $target = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path repack
          Copy-Item signed/termide.exe repack/
          Copy-Item README.md, LICENSE repack/
          $archiveName = "termide-$version-$target.zip"
          Compress-Archive -Path repack/* -DestinationPath $archiveName -Force
          (Get-FileHash $archiveName -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline "$archiveName.sha256"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-x86_64-pc-windows-msvc
          path: termide-${{ github.ref_name }}-x86_64-pc-windows-msvc.*
          overwrite: true

  # Create GitHub Release with artifacts
  release:
    name: Create Release
    needs: [build, build-deb, build-rpm, sign-windows]
    runs-on: ubuntu-latest
    # Only create release when triggered by tag (not workflow_dispatch).
    # sign-windows may be skipped (secrets not yet configured), so allow that.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      && !failure() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract section for this version from CHANGELOG.md
          # Start from "## [VERSION]" line, end before next "## [" line
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # A tag without its section (fragments not folded in, a typo in the
          # heading) would publish a release with no notes.
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          # Write to file to preserve newlines
          echo "$BODY" > release_notes.md

      # The packages only: the unsigned exe and SignPath's input are not
      # named termide-*.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: termide-*
          path: artifacts

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release_notes.md
          draft: false
          prerelease: false

  # Update AUR packages
  update-aur:
    name: Update AUR
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # AUR git/SSH backend is intermittently locked read-only (malware-incident
    # maintenance on the AUR side). Keep publishing on every tag, but don't let
    # an AUR-side outage fail the whole release workflow — it self-heals once
    # AUR reopens writes. Revert this once AUR is stable again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Update AUR packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Calculate SHA256 checksums. A failed download fails the step: the
          # checksum of an error page would be published otherwise.
          sha() { curl -fsSL --retry 3 "$1" -o /tmp/sha-input && sha256sum /tmp/sha-input | cut -d' ' -f1; }
          SRC_SHA=$(sha "https://github.com/termide/termide/archive/refs/tags/${VERSION}.tar.gz")
          BIN_X64_SHA=$(sha "https://github.com/termide/termide/releases/download/${VERSION}/termide-${VERSION}-x86_64-unknown-linux-gnu.tar.gz")
          BIN_ARM_SHA=$(sha "https://github.com/termide/termide/releases/download/${VERSION}/termide-${VERSION}-aarch64-unknown-linux-gnu.tar.gz")

          # Update termide (source package)
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new" git clone ssh://aur@aur.archlinux.org/termide.git /tmp/aur-termide
          cd /tmp/aur-termide

          # Sync package() and other sections from repo
          cp $GITHUB_WORKSPACE/packaging/aur/PKGBUILD PKGBUILD

          # Update PKGBUILD
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('${SRC_SHA}')/" PKGBUILD

          # Generate .SRCINFO using Docker (run as non-root user)
          OWNER=$(stat -c %u:%g .)
          docker run --rm -v "$PWD:/pkg" archlinux:base bash -c "
            set -e
            pacman -Syu --noconfirm pacman-contrib sudo fakeroot
            useradd -m builder
            chown -R builder:builder /pkg
            cd /pkg && sudo -u builder makepkg --printsrcinfo > .SRCINFO
          "
          sudo chown -R $OWNER .

          git config user.email "github-actions@termide.dev"
          git config user.name "GitHub Actions"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "termide PKGBUILD already up to date for ${VERSION}"
          else
            git commit -m "Update to ${VERSION}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push
          fi

          # Update termide-bin (binary package)
          cd /tmp
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new" git clone ssh://aur@aur.archlinux.org/termide-bin.git /tmp/aur-termide-bin
          cd /tmp/aur-termide-bin

          # Sync package() and other sections from repo
          cp $GITHUB_WORKSPACE/packaging/aur/PKGBUILD-bin PKGBUILD

          # Update PKGBUILD
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('${BIN_X64_SHA}')/" PKGBUILD
          sed -i "s/sha256sums_aarch64=.*/sha256sums_aarch64=('${BIN_ARM_SHA}')/" PKGBUILD

          # Generate .SRCINFO using Docker (run as non-root user)
          OWNER=$(stat -c %u:%g .)
          docker run --rm -v "$PWD:/pkg" archlinux:base bash -c "
            set -e
            pacman -Syu --noconfirm pacman-contrib sudo fakeroot
            useradd -m builder
            chown -R builder:builder /pkg
            cd /pkg && sudo -u builder makepkg --printsrcinfo > .SRCINFO
          "
          sudo chown -R $OWNER .

          git config user.email "github-actions@termide.dev"
          git config user.name "GitHub Actions"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "termide-bin PKGBUILD already up to date for ${VERSION}"
          else
            git commit -m "Update to ${VERSION}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push
          fi

  # Update Homebrew tap
  update-homebrew:
    name: Update Homebrew
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Setup SSH for Homebrew tap
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMEBREW_TAP_SSH_KEY }}" > ~/.ssh/homebrew_tap
          chmod 600 ~/.ssh/homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update Homebrew formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Calculate SHA256 for all platforms; a failed download fails the step
          sha() { curl -fsSL --retry 3 "$1" -o /tmp/sha-input && sha256sum /tmp/sha-input | cut -d' ' -f1; }
          SHA_DARWIN_X64=$(sha "https://github.com/termide/termide/releases/download/${VERSION}/termide-${VERSION}-x86_64-apple-darwin.tar.gz")
          SHA_DARWIN_ARM=$(sha "https://github.com/termide/termide/releases/download/${VERSION}/termide-${VERSION}-aarch64-apple-darwin.tar.gz")
          SHA_LINUX_X64=$(sha "https://github.com/termide/termide/releases/download/${VERSION}/termide-${VERSION}-x86_64-unknown-linux-gnu.tar.gz")
          SHA_LINUX_ARM=$(sha "https://github.com/termide/termide/releases/download/${VERSION}/termide-${VERSION}-aarch64-unknown-linux-gnu.tar.gz")

          # Clone homebrew-termide over SSH (deploy key), mirroring the AUR job
          GIT_SSH_COMMAND="ssh -i ~/.ssh/homebrew_tap -o StrictHostKeyChecking=accept-new" \
            git clone git@github.com:termide/homebrew-termide.git /tmp/homebrew-termide
          cd /tmp/homebrew-termide

          # Update version line
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Formula/termide.rb

          # Update all URLs (replace version in download URLs)
          sed -i "s|/download/[0-9.]*|/download/${VERSION}|g" Formula/termide.rb
          sed -i "s|termide-[0-9.]*-|termide-${VERSION}-|g" Formula/termide.rb

          # Update SHA256 for each platform using unique URL patterns as anchors
          sed -i "/x86_64-apple-darwin/{ n; s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_DARWIN_X64}\"/; }" Formula/termide.rb
          sed -i "/aarch64-apple-darwin/{ n; s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_DARWIN_ARM}\"/; }" Formula/termide.rb
          sed -i "/x86_64-unknown-linux-gnu/{ n; s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_LINUX_X64}\"/; }" Formula/termide.rb
          sed -i "/aarch64-unknown-linux-gnu/{ n; s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA_LINUX_ARM}\"/; }" Formula/termide.rb

          git config user.email "github-actions@termide.dev"
          git config user.name "GitHub Actions"
          git add Formula/termide.rb
          # Only push when the formula actually changed; never mask a real push
          # failure — a bad deploy key must fail the job loudly instead of
          # silently leaving the tap frozen.
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}, nothing to push"
          else
            git commit -m "Update to ${VERSION}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/homebrew_tap" git push
          fi

  # Refresh the website: the version, the download size, the generated pages
  update-site:
    name: Update website
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Setup SSH for the website repository
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$SITE_DEPLOY_KEY" ]; then
            echo "::error::SITE_DEPLOY_KEY is not set: add a deploy key with write access to termide/termide.github.io"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SITE_DEPLOY_KEY" > ~/.ssh/site
          chmod 600 ~/.ssh/site
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # The site builds itself (Astro, its own deploy workflow) on this push.
      - name: Set the version and download size
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/site -o StrictHostKeyChecking=accept-new" \
            git clone git@github.com:termide/termide.github.io.git /tmp/site
          cd /tmp/site

          # The median of the binary archives (.tar.gz, .zip), in whole MB.
          MB=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '[.assets[] | select(.name | test("\\.(tar\\.gz|zip)$")) | .size] | sort | .[length / 2 | floor] / 1048576 + 0.5 | floor')
          echo "version ${VERSION}, download ~${MB} MB"

          python3 - "$VERSION" "$MB" <<'EOF'
          import json, sys
          path = "src/data.json"
          raw = open(path, encoding="utf-8").read()
          data = json.loads(raw)
          data["version"], data["download_mb"] = sys.argv[1], int(sys.argv[2])
          end = "\n" if raw.endswith("\n") else ""
          open(path, "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2) + end)
          EOF

          git config user.email "github-actions@termide.dev"
          git config user.name "GitHub Actions"
          git add src/data.json
          if git diff --cached --quiet; then
            echo "Website already up to date for ${VERSION}"
          else
            git commit -m "chore: refresh landing to v${VERSION}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/site" git push
          fi
