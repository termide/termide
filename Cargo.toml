[workspace]
members = ["crates/*"]
resolver = "2"

[patch.crates-io]
unicode-width = { path = "crates/unicode-width-fix" }

[workspace.package]
version = "0.50.0"
edition = "2021"
authors = ["Nick Nizovtsev"]
license = "MIT"
repository = "https://github.com/termide/termide"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
dirs = "6.0"
dunce = "1.0"
ropey = "1.6"
arboard = "3.4"
# macOS pasteboard access below arboard's builder, which can only write one
# flavor at a time; see `termide-clipboard::copy_files`.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
unicode-segmentation = "1.11"
unicode-width = "0.2"
# Infra dependencies
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
lsp-types = "0.97"
regex = "1.12"
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.4"
ignore = "0.4"
nucleo-matcher = "0.3"
# Snowball stemming (English, Russian) for the agent's `recall` ranking.
rust-stemmers = "1.2"
sysinfo = "0.31"
starship-battery = "0.12"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
vte = "0.13"
# Additional shared dependencies
base64 = "0.22"
tempfile = "3.12"
log = "0.4"
libc = "0.2"
# Termination signals (SIGHUP, SIGTERM) for a clean shutdown; already in the
# tree through crossterm.
signal-hook = "0.3"
glob = "0.3"
similar = "2.7"
serde_json = "1.0"
url = "2"
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
html5ever = "0.29"
scraper = { version = "0.27", default-features = false }
ureq = "2.10"

# Shared by several crates; kept here so their versions move together.
thiserror = "2.0"
tokio = "1"
windows-sys = "0.59"
nix = "0.29"
image = { version = "0.25", default-features = false }
zeroize = "1"
zip = { version = "9.1", default-features = false }
sqlx = { version = "0.8", default-features = false }
open = "5"
percent-encoding = "2"
webpki-roots = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.16", default-features = false }
tree-sitter-bash = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.3"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

[package]
name = "termide"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "All-in-one terminal workspace: editor, file manager, terminal, git and coding agent"
publish = false
repository.workspace = true
license.workspace = true
keywords = ["terminal", "ide", "file-manager", "tui", "terminal-ui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    ".github/",
    "doc/",
    ".gitignore",
    "flake.nix",
    "flake.lock"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.deb]
maintainer = "Nick Nizovtsev <nizovtsevnv@gmail.com>"
copyright = "2025-2026, Nick Nizovtsev <nizovtsevnv@gmail.com> and Termide contributors"
license-file = ["LICENSE", "4"]
extended-description = """\
Termide is an all-in-one terminal workspace for workstations and servers, written \
in Rust. It combines a code editor with LSP, a dual-pane file manager with SFTP/FTP \
and background file operations, an integrated terminal, Git integration, a read-only \
database viewer, and a coding agent that works with local or hosted models. \
On Unix, instances can be detached and reattached from any terminal."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/termide", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/termide/", "644"],
    ["LICENSE", "usr/share/doc/termide/", "644"],
    ["completions/termide.bash", "usr/share/bash-completion/completions/termide", "644"],
    ["completions/_termide", "usr/share/zsh/vendor-completions/", "644"],
    ["completions/termide.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.generate-rpm]
name = "termide"
license = "MIT"
summary = "All-in-one terminal workspace: editor, file manager, terminal, git and coding agent"
assets = [
    { source = "target/release/termide", dest = "/usr/bin/termide", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/termide/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/termide/LICENSE", mode = "644", doc = true },
    { source = "completions/termide.bash", dest = "/usr/share/bash-completion/completions/termide", mode = "644" },
    { source = "completions/_termide", dest = "/usr/share/zsh/site-functions/_termide", mode = "644" },
    { source = "completions/termide.fish", dest = "/usr/share/fish/vendor_completions.d/termide.fish", mode = "644" },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]

[dependencies]
# The root binary is a thin shell: CLI parsing, terminal setup, config load and
# the app event loop. Everything else lives in the workspace crates, so only
# what `src/main.rs` and `src/ui.rs` actually name belongs here — a dependency
# needed by a crate must be declared by that crate.
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm.workspace = true
dirs.workspace = true
log.workspace = true
ratatui.workspace = true

# Workspace crates referenced directly from main.rs / ui.rs
termide-agent-core = { path = "crates/agent-core" }
termide-app = { path = "crates/app" }
termide-config = { path = "crates/config" }
termide-core = { path = "crates/core" }
termide-detach = { path = "crates/detach" }
termide-git = { path = "crates/git" }
termide-i18n = { path = "crates/i18n" }
termide-keyboard = { path = "crates/keyboard" }
termide-layout = { path = "crates/layout" }
termide-plugin-perforce = { path = "crates/plugin-perforce" }
termide-plugins = { path = "crates/plugins" }
termide-project = { path = "crates/project" }
termide-theme = { path = "crates/theme" }
termide-ui-render = { path = "crates/ui-render" }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile.workspace = true
# tests/grammar_loads.rs asserts every SUPPORTED_LANGUAGES grammar loads.
termide-highlight = { path = "crates/highlight" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

# Dependencies keep line tables only: a backtrace still names their lines,
# but their variables are not inspectable, and their artefacts come out
# about a quarter smaller (tokio's rlib 19.6 MB → 14.9 MB). The workspace's own
# crates keep full debug info, for stepping through them in a debugger.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
